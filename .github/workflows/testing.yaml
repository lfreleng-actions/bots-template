---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2026 The Linux Foundation

# Exercises the reusable bot workflow.
#
# Pull request runs are SECRETLESS by design: a same-repository PR
# can modify the local reusable workflow and asset scripts, so a PR
# check that held a model credential would hand it to the code
# under review. PR runs therefore set skip_agent, proving the
# plumbing (ledger fetch, selection, evidence upload, report) from
# the PR head without any secret in reach.
#
# The full agent session -- dry-run, read-only -- runs from
# workflow_dispatch instead: a maintainer triggers it explicitly
# against a chosen ref, which is the trusted, approval-gated
# execution path for validating agent behaviour before merge.
name: 'Testing 🧪'

# yamllint disable-line rule:truthy
on:
  pull_request:
  workflow_dispatch:
    inputs:
      repositories:
        description: 'Repositories for the manual dry-run (commas/spaces)'
        type: string
        default: ''
      max_targets:
        description: 'Targets to hand to the agent in the manual dry-run'
        type: string
        default: '2'

permissions: {}

# A new push to a pull request supersedes that pull request's older
# run. Each manual dispatch takes a group of its own, so a second
# dispatch never cancels an agent session already in flight.
concurrency:
  group: >-
    ${{ format('testing-{0}', github.event_name == 'pull_request'
    && github.ref || github.run_id) }}
  cancel-in-progress: true

jobs:
  plumbing:
    name: 'Plumbing (secretless, ${{ matrix.invocation }})'
    strategy:
      matrix:
        # Two legs prove invocation namespaces never collide. Both are
        # dry, so they share only this run's lock: one runs, one waits.
        invocation: [first, second]
    if: github.event_name == 'pull_request'
    permissions:
      # The job passes no secrets and skips the agent session, so
      # even a malicious PR-head script holds nothing but reads.
      contents: read  # Asset checkout and public repository reads
      actions: read  # Ledger and result artifact reads
    uses: $/.github/workflows/bot.yaml
    with:
      # The owner running the test, so a fork exercises its own
      # organisation rather than reaching into the upstream one.
      org: "${{ github.repository_owner }}"
      dry_run: true
      # Skip the agent: PR runs are secretless (see header comment).
      skip_agent: true
      max_targets: '3'
      # Block mode with the organisation allow-list, as the scheduled
      # caller runs, so a pull request proves the trusted jobs' egress.
      egress_policy: 'block'
      # yamllint disable-line rule:line-length
      egress_allow_config: '@56d70f0eae78f334a598d1ffe071d4b821517b22'  # v0.17.1
      assets_repository: >-
        ${{ github.event.pull_request.head.repo.full_name }}
      assets_ref: "${{ github.event.pull_request.head.sha }}"

  dry-run:
    name: 'Agent dry-run (manual)'
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: read  # Asset checkout and public repository reads
      actions: read  # Ledger, session and result artifact reads
    uses: $/.github/workflows/bot.yaml
    with:
      org: "${{ github.repository_owner }}"
      dry_run: true
      repositories: "${{ inputs.repositories || '' }}"
      max_targets: "${{ inputs.max_targets || '2' }}"
      max_concurrent_agents: '2'
      egress_policy: 'block'
      # yamllint disable-line rule:line-length
      egress_allow_config: '@56d70f0eae78f334a598d1ffe071d4b821517b22'  # v0.17.1
      assets_repository: "${{ github.repository }}"
      assets_ref: "${{ github.sha }}"
    secrets:
      # Personal fine-grained PAT with Copilot Requests and no
      # repository grants. Native caller tokens are not supported.
      copilot_token: "${{ secrets.COPILOT_CLI_TOKEN }}"

  regression:
    name: 'Offline regression tests'
    runs-on: 'ubuntu-latest'
    timeout-minutes: 10
    permissions:
      contents: read  # Test checked-out code without write credentials
    steps:
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: 'audit'
      - name: 'Checkout repository'
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 'Install uv'
        # yamllint disable-line rule:line-length
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        # Outside the workspace, as in bot.yaml: setup-uv starts the
        # interpreter it finds in its working directory.
        env:
          UV_NO_CONFIG: '1'
          UV_SYSTEM_PYTHON: '1'
          UV_NO_PROJECT: '1'
        with:
          working-directory: "${{ runner.temp }}"
          enable-cache: false
      - name: 'Run offline regression suite'
        run: uv run --locked python -B -m unittest discover -s tests -v

  # Runs the prepare job's uv steps exactly as bot.yaml writes them
  # (the contract tests hold the copies equal) with a .venv and a
  # .python-version planted in the workspace root, setup-uv's default
  # working directory, and in the assets checkout, where the pre-flight
  # runs uv, plus a uv.toml in the root. Each planted interpreter
  # appends to a marker as it starts and exits 1, because uv passes
  # over an interpreter that fails without failing the step.
  uv-workdir:
    name: 'uv steps ignore planted Python'
    runs-on: 'ubuntu-latest'
    timeout-minutes: 10
    permissions:
      contents: read  # Check out the assets as the prepare job does
    steps:
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: 'audit'
      - name: 'Checkout assets'
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: 'bot-assets'
          persist-credentials: false
      - name: 'Plant Python and uv settings'
        run: |
          exe() {
            { echo '#!/bin/sh'
              echo "echo \"ran: \$0\" >> '$RUNNER_TEMP/planted-ran'"
              echo 'exit 1'; } > "$1"
            chmod +x "$1"
          }
          plant() {
            mkdir -p "$1/.venv/bin"
            printf 'home = /usr/bin\nversion = 3.12.0\n' > "$1/.venv/pyvenv.cfg"
            exe "$1/.venv/bin/python3"
            exe "$1/.venv/bin/python"
            exe "$1/planted-python"
            echo "$1/planted-python" > "$1/.python-version"
          }
          plant "$GITHUB_WORKSPACE"
          plant "$GITHUB_WORKSPACE/bot-assets"
          printf '%s\n' 'cache-dir = "/nonexistent/planted-cache"' \
            'required-version = "==0.0.1"' > "$GITHUB_WORKSPACE/uv.toml"
      - name: 'Set up uv'
        id: setup-uv
        # yamllint disable-line rule:line-length
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        env:
          UV_NO_CONFIG: '1'
          UV_SYSTEM_PYTHON: '1'
          UV_NO_PROJECT: '1'
        with:
          working-directory: "${{ runner.temp }}"
          enable-cache: false
      - name: 'Install zizmor'
        run: uv tool install 'zizmor==1.30.1'
      - name: 'Pre-flight: workflow contracts and audit'
        run: |
          # uv run reuses an existing project environment, and runs its
          # interpreter, in the assets checkout or a uv workspace above
          # it. Build the environment under RUNNER_TEMP instead, from an
          # interpreter found there.
          py="$(cd "$RUNNER_TEMP" &&
            UV_NO_CONFIG=1 uv python find --system --no-project)"
          if [ -z "$py" ]; then
            echo '::error::No Python interpreter found for the pre-flight'
            exit 1
          fi
          cd bot-assets
          UV_PROJECT_ENVIRONMENT="$RUNNER_TEMP/preflight-venv" \
            uv run --locked --python "$py" \
            python -B scripts/preflight.py workflow --root .
      - name: 'Check outputs and marker'
        env:
          UV_VERSION: "${{ steps.setup-uv.outputs.uv-version }}"
          PYTHON_VERSION: "${{ steps.setup-uv.outputs.python-version }}"
        run: |
          if [ -e "$RUNNER_TEMP/planted-ran" ]; then
            echo '::error::A planted interpreter ran:'
            cat "$RUNNER_TEMP/planted-ran"
            exit 1
          fi
          installed="$(uv --version | cut -d' ' -f2)"
          if ! [[ "$UV_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] ||
            [ "$UV_VERSION" = 0.0.1 ] || [ "$installed" != "$UV_VERSION" ]; then
            echo "::error::uv-version '$UV_VERSION', uv on PATH '$installed'"
            exit 1
          fi
          [[ "$PYTHON_VERSION" =~ ^3\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::python-version output is '$PYTHON_VERSION'"
            exit 1; }
          [ "${UV_CACHE_DIR:-}" != /nonexistent/planted-cache ] || {
            echo '::error::UV_CACHE_DIR came from the planted uv.toml'
            exit 1; }
          "$RUNNER_TEMP/preflight-venv/bin/python" --version
          echo "uv $UV_VERSION, Python $PYTHON_VERSION, no planted file used"

  docs:
    name: 'Documentation build'
    if: github.event_name == 'pull_request'
    runs-on: 'ubuntu-latest'
    permissions:
      contents: read  # Check out the documentation sources
    timeout-minutes: 10
    steps:
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2  # v2.22.2
        with:
          egress-policy: 'audit'

      - name: 'Checkout repository'
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: 'Install uv'
        # yamllint disable-line rule:line-length
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        # Outside the workspace, as in bot.yaml: setup-uv starts the
        # interpreter it finds in its working directory.
        env:
          UV_NO_CONFIG: '1'
          UV_SYSTEM_PYTHON: '1'
          UV_NO_PROJECT: '1'
        with:
          working-directory: "${{ runner.temp }}"
          enable-cache: false

      # Proves the site builds from the pull request head without
      # granting it any Pages permission; the deployment lives in
      # documentation.yaml and runs from the default branch alone.
      - name: 'Build documentation'
        shell: bash
        run: |
          uv venv --python 3.13
          uv pip install --require-hashes \
            --requirement docs/requirements.txt
          .venv/bin/mkdocs build --strict
