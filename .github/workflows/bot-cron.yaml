---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2026 The Linux Foundation

# Scheduled and on-demand entry point for the reusable workflow.
#
# Adapting this file for a new bot:
#   1. Rename the workflow (`name:` below) after the bot.
#   2. Add a schedule: uncomment the `schedule:` block under `on:` and
#      set the cron lines. The example runs at 07:00 UTC on weekdays.
#      Keep `dry_run` true for scheduled runs until the rollout in
#      docs/DESIGN.md clears live operation, then flip the expression
#      in the `bot` job.
#   3. Add dispatch inputs the bot needs and forward them in the
#      `bot` job's `with:` block, declaring each in bot.yaml too.
#
# Disabling this workflow in the Actions UI is the kill switch.
#
# Trusted jobs hold the App key and run in block mode with the
# organisation allow-list; the agent job holds the model credential
# alone and never sees the App key (docs/DESIGN.md).
name: 'Bot ⏰'

# yamllint disable-line rule:truthy
on:
  # A workflow needs one live trigger; the dispatch form is it until
  # the bot earns a schedule. To schedule, uncomment these lines:
  # schedule:
  #   # 07:00 UTC, Monday to Friday
  #   - cron: '0 7 * * 1-5'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run the agent and the checks; write nothing'
        type: boolean
        default: true
      model:
        description: 'Model'
        type: choice
        options:
          - 'Claude Opus 5.5'
          - 'Claude Fable 5.1'
          - 'Claude Sonnet 5.5'
          - 'GPT-6 Astra'
        default: 'Claude Opus 5.5'
      repositories:
        description: 'Repositories to scan (commas and/or spaces)'
        type: string
        default: ''
      max_targets:
        description: 'Targets to hand to the agent at most (0 = no cap)'
        type: string
        default: '20'

permissions: {}

# Serialise live runs of this caller. A group keeps one pending run and
# a newcomer cancels it, so this is not a FIFO queue. A dry dispatch
# writes nothing and takes a group of its own: it neither waits behind
# the schedule nor cancels a pending live run.
concurrency:
  group: >-
    ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run
    && format('bot-dry-run-{0}', github.run_id)
    || 'bot' }}
  cancel-in-progress: false

jobs:
  options:
    name: 'Resolve options'
    runs-on: 'ubuntu-latest'
    timeout-minutes: 2
    permissions: {}
    outputs:
      model: "${{ steps.map.outputs.id }}"
    steps:
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: 'block'

      # Display names in the dispatch form map to the identifiers the
      # Copilot CLI accepts.
      - name: 'Map display name to identifier'
        id: map
        env:
          MODEL: "${{ inputs.model || 'Claude Opus 5.5' }}"
        run: |
          case "$MODEL" in
            'Claude Opus 5.5') id='claude-opus-5.5' ;;
            'Claude Fable 5.1') id='claude-fable-5.1' ;;
            'Claude Sonnet 5.5') id='claude-sonnet-5.5' ;;
            'GPT-6 Astra') id='gpt-6-astra' ;;
            *) echo "::error::Unknown model $MODEL"; exit 1 ;;
          esac
          echo "id=$id" >> "$GITHUB_OUTPUT"

  bot:
    name: 'Bot'
    needs: 'options'
    permissions:
      contents: read  # Asset checkout and public repository reads
      actions: read  # Ledger, session and result artifact reads
    uses: $/.github/workflows/bot.yaml
    with:
      # The owner this workflow runs under. Naming it this way rather
      # than hard-coding it keeps a fork's scheduled runs inside the
      # fork.
      org: "${{ github.repository_owner }}"
      # Scheduled runs stay dry-run until the rollout clears them; a
      # manual dispatch takes the operator's choice.
      dry_run: >-
        ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run }}
      model: "${{ needs.options.outputs.model }}"
      repositories: "${{ inputs.repositories || '' }}"
      max_targets: "${{ inputs.max_targets || '20' }}"
      egress_policy: 'block'
      # yamllint disable-line rule:line-length
      egress_allow_config: '@e0e35011ee145321a51d3226f044ec88dfe645b1'  # v0.16.4
      # Repository-level credentials reach the trusted prepare and
      # apply jobs, never an action in the agent job. No client id
      # permits dry-run fallback; a missing key fails token creation
      # before any session runs.
      github_app_client_id: "${{ vars.BOT_APP_CLIENT_ID || '' }}"
      # Run the pipeline with the assets from the triggering commit.
      assets_repository: "${{ github.repository }}"
      assets_ref: "${{ github.sha }}"
    secrets:
      copilot_token: "${{ secrets.COPILOT_CLI_TOKEN }}"
      github_app_private_key: "${{ secrets.BOT_APP_PRIVATE_KEY }}"
