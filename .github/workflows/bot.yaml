---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2026 The Linux Foundation

# Reusable workflow template for an organisation bot: select targets,
# run one Copilot CLI agent session per target, and let a trusted job
# make the bot's one write from a per-repository App token.
#
# Trust boundary (docs/DESIGN.md): the agent job holds no repository
# credential and never sees the App key. It emits a verdict; the
# apply job treats it as hostile input, corroborates it offline, and
# alone holds a token that can write. Steps marked "replace" are the
# template's placeholders; everything else is the shared shape.
name: 'Bot [R] 🤖'

# yamllint disable-line rule:truthy
on:
  workflow_call:
    inputs:
      org:
        description: 'Target owner; live runs require an organisation App'
        required: true
        type: string
      dry_run:
        description: 'Run the agent and the checks; write nothing'
        type: boolean
        default: true
      model:
        description: 'Copilot CLI model identifier'
        type: string
        default: 'claude-opus-5.5'
      repositories:
        description: 'Repositories to scan; commas and/or spaces'
        type: string
        default: ''
      exclude_repos:
        description: 'Comma-separated repos to skip (overrides bundled list)'
        type: string
        default: ''
      max_targets:
        description: 'Targets to hand to the agent at most; 0 lifts the cap'
        type: string
        default: '20'
      max_concurrent_agents:
        description: 'Agent sessions running at once (1-30)'
        type: string
        default: '5'
      max_runtime_minutes:
        description: 'Wall-clock budget for each agent session'
        type: string
        default: '20'
      skip_agent:
        description: 'Plumbing test: prepare and report without sessions'
        type: boolean
        default: false
      egress_policy:
        description: 'harden-runner egress for trusted jobs: audit or block'
        type: string
        default: 'block'
      egress_allow_config:
        description: 'harden-runner-block-action config coordinate'
        type: string
        default: ''
      github_app_client_id:
        description: 'GitHub App client id; empty limits runs to dry-run'
        type: string
        default: ''
      assets_repository:
        description: 'Trusted repository providing the prompt and scripts'
        type: string
        default: 'lfreleng-actions/bots-template'
      assets_ref:
        description: >-
          Commit, tag or branch of the assets; empty resolves the
          calling workflow's own commit
        type: string
        default: ''
    secrets:
      copilot_token:
        description: >-
          Personal fine-grained PAT with Copilot Requests and no
          repository grants; the only credential the agent receives
        required: false
      github_app_private_key:
        description: 'GitHub App private key, used in trusted jobs alone'
        required: false

permissions: {}

# Live runs hold one lock per caller repository and owner across the
# whole pipeline. Dry runs write nothing, so they lock within their
# own caller run and never cancel or wait on a live run.
concurrency:
  group: >-
    ${{ inputs.dry_run
    && format('bot-dry-run-{0}-{1}', github.run_id, inputs.org)
    || format('bot-{0}-{1}', github.repository, inputs.org) }}
  cancel-in-progress: false

jobs:
  prepare:
    name: 'Prepare'
    runs-on: 'ubuntu-latest'
    timeout-minutes: 20
    permissions:
      contents: read  # Checkout trusted assets; read public repositories
      actions: read  # Fetch prior ledgers from this repository's runs
    outputs:
      assets_sha: "${{ steps.pinned.outputs.sha }}"
      namespace: "${{ steps.identity.outputs.namespace }}"
      evidence_id: "${{ steps.evidence.outputs.artifact-id }}"
      selection_sha256: "${{ steps.digests.outputs.selection }}"
      ledger_sha256: "${{ steps.digests.outputs.ledger }}"
      count: "${{ steps.chosen.outputs.count }}"
      matrix: "${{ steps.chosen.outputs.matrix }}"
      run_agent: "${{ steps.chosen.outputs.run_agent }}"
      job_timeout: "${{ steps.budget.outputs.job_timeout }}"
      agent_timeout: "${{ steps.budget.outputs.agent_timeout }}"
      max_parallel: "${{ steps.budget.outputs.max_parallel }}"
    steps:
      - name: 'Load egress allow-list'
        if: inputs.egress_policy == 'block'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@a32eb064a1188f6b0f15d2c0c0381efe54b0dd22 # v0.12.2
        with:
          config: "${{ inputs.egress_allow_config }}"
          allow_list_summary: 'true'

      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: "${{ inputs.egress_policy }}"
          allowed-endpoints: "${{ env.CONNECTION_ALLOW_LIST }}"

      # Artifact names carry this namespace so two invocations in one
      # caller run (or a rerun) never read each other's files.
      - name: 'Allocate invocation identity'
        id: identity
        env:
          RUN_ID: "${{ github.run_id }}"
          RUN_ATTEMPT: "${{ github.run_attempt }}"
        run: |
          python3 - <<'PY'
          import os, uuid
          run = os.environ['RUN_ID']
          attempt = os.environ['RUN_ATTEMPT']
          namespace = f"{run}-{attempt}-{uuid.uuid4().hex}"
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'namespace={namespace}\n')
          PY

      - name: 'Check inputs'
        id: budget
        env:
          MAX_TARGETS: "${{ inputs.max_targets }}"
          MAX_RUNTIME: "${{ inputs.max_runtime_minutes }}"
          MAX_AGENTS: "${{ inputs.max_concurrent_agents }}"
          MODEL: "${{ inputs.model }}"
          REPOSITORIES: "${{ inputs.repositories }}"
        run: |
          [[ "$MAX_TARGETS" =~ ^[0-9]+$ ]] || {
            echo '::error::max_targets must be a non-negative integer'
            exit 1; }
          [[ "$MAX_RUNTIME" =~ ^[1-9][0-9]*$ ]] && [ "$MAX_RUNTIME" -le 120 ] ||
            { echo '::error::max_runtime_minutes must be 1-120'; exit 1; }
          [[ "$MAX_AGENTS" =~ ^[1-9][0-9]*$ ]] && [ "$MAX_AGENTS" -le 30 ] || {
            echo '::error::max_concurrent_agents must be 1-30'; exit 1; }
          [[ "$MODEL" =~ ^[a-z0-9.-]+$ ]] || {
            echo '::error::model must be a lower-case identifier'; exit 1; }
          # Expressions cannot add, so the job budget (session plus
          # toolchain setup and upload) is computed here. The read
          # token scopes to the named repositories; empty keeps it
          # organisation-wide, which a scan needs. sed rather than
          # grep -v: grep exits 1 on empty input.
          repositories="$(printf '%s' "$REPOSITORIES" | tr ', ' '\n' \
            | sed '/^$/d' | paste -sd, -)"
          [[ "$repositories" =~ ^[A-Za-z0-9_.,-]*$ ]] || {
            echo '::error::repository names carry unexpected characters'
            exit 1; }
          {
            echo "agent_timeout=$MAX_RUNTIME"
            echo "job_timeout=$((MAX_RUNTIME + 15))"
            echo "max_parallel=$MAX_AGENTS"
            echo "repositories=$repositories"
          } >> "$GITHUB_OUTPUT"

      - name: 'Require App for live runs'
        if: ${{ !inputs.dry_run && inputs.github_app_client_id == '' }}
        run: |
          echo '::error::Live runs require organisation App credentials'
          exit 1

      - name: 'Resolve assets ref'
        id: assets
        env:
          ASSETS_REF: "${{ inputs.assets_ref }}"
          # yamllint disable-line rule:line-length
          JOB_WORKFLOW_SHA: "${{ job.workflow_sha || github.job_workflow_sha }}"
        run: |
          ref="${ASSETS_REF:-$JOB_WORKFLOW_SHA}"
          if [ -z "$ref" ]; then
            echo '::error::Cannot resolve workflow commit; set assets_ref'
            exit 1
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: 'Checkout trusted assets'
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: "${{ inputs.assets_repository }}"
          ref: "${{ steps.assets.outputs.ref }}"
          path: 'bot-assets'
          persist-credentials: false

      - name: 'Pin assets commit'
        id: pinned
        run: |
          sha="$(git -C bot-assets rev-parse HEAD)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      # Pre-flight gate. The contract tests and zizmor run again here,
      # from the pinned assets, so a drift merged into the workflow
      # fails this run before any token exists. The config check
      # reads the credential shapes and prints nothing it read.
      - name: 'Set up uv'
        # yamllint disable-line rule:line-length
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false

      - name: 'Install zizmor'
        run: uv tool install 'zizmor==1.30.1'

      - name: 'Pre-flight: workflow contracts and audit'
        run: |
          cd bot-assets
          uv run --locked python -B scripts/preflight.py workflow --root .

      - name: 'Pre-flight: configuration and credentials'
        env:
          BOT_APP_CLIENT_ID: "${{ inputs.github_app_client_id }}"
          BOT_APP_PRIVATE_KEY: "${{ secrets.github_app_private_key }}"
          COPILOT_GITHUB_TOKEN: "${{ secrets.copilot_token }}"
          EGRESS_POLICY: "${{ inputs.egress_policy }}"
          EGRESS_ALLOW_CONFIG: "${{ inputs.egress_allow_config }}"
          DRY_RUN: "${{ inputs.dry_run }}"
          # yamllint disable-line rule:line-length
          JOB_WORKFLOW_SHA: "${{ job.workflow_sha || github.job_workflow_sha }}"
          ASSETS_SHA: "${{ steps.pinned.outputs.sha }}"
        run: |
          extra=()
          if [ "$DRY_RUN" = true ]; then extra+=(--dry-run); fi
          python3 bot-assets/scripts/preflight.py config \
            --config bot-assets/config/bot.json \
            --egress-policy "$EGRESS_POLICY" \
            --egress-allow-config "$EGRESS_ALLOW_CONFIG" \
            --workflow-sha "$JOB_WORKFLOW_SHA" \
            --assets-sha "$ASSETS_SHA" "${extra[@]}"

      # Read-only. A bot that needs more reads adds permission-*: read
      # grants here; nothing in this job may hold a write.
      - name: 'Mint read-only App token'
        id: app-token
        if: inputs.github_app_client_id != ''
        # yamllint disable-line rule:line-length
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: "${{ inputs.github_app_client_id }}"
          private-key: "${{ secrets.github_app_private_key }}"
          owner: "${{ inputs.org }}"
          # Empty means every repository of the owner: a scan is
          # organisation-wide by design and this token reads.
          repositories: "${{ steps.budget.outputs.repositories }}"
          permission-contents: 'read'
          permission-metadata: 'read'

      # The slug the mint returns is the one signal that says whose key
      # was wired in; a probe with the token proves it cannot write.
      - name: 'Pre-flight: App identity and token grants'
        if: inputs.github_app_client_id != ''
        env:
          GH_TOKEN: "${{ steps.app-token.outputs.token }}"
          MINTED_SLUG: "${{ steps.app-token.outputs.app-slug }}"
        run: |
          python3 bot-assets/scripts/preflight.py identity \
            --config bot-assets/config/bot.json --minted-slug "$MINTED_SLUG"
          python3 bot-assets/scripts/preflight.py token

      # The ledger lives in this repository's own artifacts, so the
      # native token reads it; the App token has no grant here.
      - name: 'Fetch prior ledger'
        env:
          GH_TOKEN: "${{ github.token }}"
          REPOSITORY: "${{ github.repository }}"
        run: |
          python3 bot-assets/scripts/ledger.py fetch \
            --repository "$REPOSITORY" --output artefacts/ledger.json \
            --artifact-name bot-ledger

      # Replace: scripts/prepare.py is the template placeholder that
      # selects nothing. The bot's selection takes the same arguments
      # and writes the same three files.
      - name: 'Prepare evidence'
        env:
          GH_TOKEN: "${{ steps.app-token.outputs.token || github.token }}"
          ORG: "${{ inputs.org }}"
          MODEL: "${{ inputs.model }}"
          DRY_RUN: "${{ inputs.dry_run }}"
          REPOSITORIES: "${{ inputs.repositories }}"
          EXCLUDE_REPOS: "${{ inputs.exclude_repos }}"
          MAX_TARGETS: "${{ inputs.max_targets }}"
        run: |
          extra=()
          if [ "$DRY_RUN" = true ]; then extra+=(--dry-run); fi
          python3 bot-assets/scripts/prepare.py \
            --org "$ORG" --output-dir artefacts \
            --model "$MODEL" \
            --ledger artefacts/ledger.json \
            --repositories "$REPOSITORIES" \
            --exclude-file bot-assets/config/excluded-repos.txt \
            --exclude-repos "$EXCLUDE_REPOS" \
            --max-targets "$MAX_TARGETS" "${extra[@]}"
          cat artefacts/selection-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: 'Publish selection outputs'
        id: chosen
        env:
          SKIP_AGENT: "${{ inputs.skip_agent }}"
        run: |
          count="$(jq '.include | length' artefacts/matrix.json)"
          [[ "$count" =~ ^[0-9]+$ ]]
          run_agent=false
          if [ "$SKIP_AGENT" != true ] && [ "$count" != 0 ]; then
            run_agent=true
          fi
          {
            echo "count=$count"
            echo "run_agent=$run_agent"
            echo "matrix=$(jq -c . artefacts/matrix.json)"
          } >> "$GITHUB_OUTPUT"

      - name: 'Record evidence digests'
        id: digests
        run: |
          python3 - <<'PY'
          import hashlib, os, pathlib
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for name, path in (('selection', 'selection.json'),
                                 ('ledger', 'ledger.json')):
                  content = pathlib.Path('artefacts', path).read_bytes()
                  output.write(f'{name}={hashlib.sha256(content).hexdigest()}\n')
          PY

      # Artifact IDs and file digests come from this trusted job.
      # An artifact name alone is not an integrity boundary.
      - name: 'Publish selection evidence'
        id: evidence
        # yamllint disable-line rule:line-length
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "bot-evidence-${{ steps.identity.outputs.namespace }}"
          path: 'artefacts/'
          retention-days: 7
          if-no-files-found: 'error'

  agent:
    name: 'Agent (${{ matrix.key }})'
    needs: 'prepare'
    if: needs.prepare.outputs.run_agent == 'true'
    runs-on: 'ubuntu-latest'
    # Session budget plus toolchain setup and artifact upload.
    timeout-minutes: ${{ fromJSON(needs.prepare.outputs.job_timeout) }}
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.prepare.outputs.max_parallel) }}
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    permissions:
      contents: read  # Checkout the prompt assets
    steps:
      # Always audit: the model backend (api.githubcopilot.com) is not
      # in the organisation allow-list, and this job holds nothing a
      # block could protect beyond the model credential.
      - name: 'Harden runner (audit)'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: 'audit'

      - name: 'Require pinned provenance'
        env:
          ASSETS_SHA: "${{ needs.prepare.outputs.assets_sha }}"
          HEAD_SHA: "${{ matrix.head_sha }}"
          KEY: "${{ matrix.key }}"
          REPOSITORY: "${{ matrix.repository }}"
        run: |
          [[ "$ASSETS_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$KEY" =~ ^[A-Za-z0-9_.-]+$ ]]
          repo_re='^[A-Za-z0-9][A-Za-z0-9._-]*/[A-Za-z0-9._-]+$'
          [[ "$REPOSITORY" =~ $repo_re ]]

      - name: 'Checkout prompt assets'
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: "${{ inputs.assets_repository }}"
          ref: "${{ needs.prepare.outputs.assets_sha }}"
          path: 'bot-assets'
          persist-credentials: false

      - name: 'Fetch selection evidence'
        # yamllint disable-line rule:line-length
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: "${{ needs.prepare.outputs.evidence_id }}"
          merge-multiple: true
          path: 'evidence'

      - name: 'Verify evidence bytes'
        env:
          SELECTION_SHA: "${{ needs.prepare.outputs.selection_sha256 }}"
          LEDGER_SHA: "${{ needs.prepare.outputs.ledger_sha256 }}"
        run: |
          python3 bot-assets/scripts/bot_evidence.py verify \
            --directory evidence \
            --expect "selection.json=$SELECTION_SHA" \
            --expect "ledger.json=$LEDGER_SHA"

      - name: 'Set up Node.js'
        # yamllint disable-line rule:line-length
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false

      - name: 'Install Copilot CLI'
        env:
          PIN_DIR: 'bot-assets/tools/copilot-cli'
        run: |
          # npm ci from the committed lockfile rather than npm install
          # of a version: the lockfile pins the whole tree by integrity
          # hash. The pin comes from the verified assets checkout and
          # installs outside anything the session reads.
          dest="$RUNNER_TEMP/copilot-cli"
          mkdir -p "$dest"
          cp "$PIN_DIR/package.json" "$PIN_DIR/package-lock.json" \
            "$PIN_DIR/.npmrc" "$dest/"
          cd "$dest"
          npm ci --ignore-scripts --no-audit --no-fund
          echo "$dest/node_modules/.bin" >> "$GITHUB_PATH"

      # Replace: add the packet files and context lines the bot's
      # prompt needs. The target fields come from the verified
      # selection, never from the matrix alone.
      - name: 'Prepare packet and prompt'
        id: packet
        env:
          KEY: "${{ matrix.key }}"
          HEAD_SHA: "${{ matrix.head_sha }}"
          DRY_RUN: "${{ inputs.dry_run }}"
        run: |
          mkdir -p artefacts
          jq -e --arg key "$KEY" '.targets[] | select(.key == $key)' \
            evidence/selection.json > artefacts/target.json
          repository="$(jq -r '.repository' artefacts/target.json)"
          number="$(jq -r '.number' artefacts/target.json)"
          [[ "$repository" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*/[A-Za-z0-9._-]+$ ]]
          [[ "$number" =~ ^[1-9][0-9]*$ ]]
          [ "$(jq -r '.head_sha' artefacts/target.json)" = "$HEAD_SHA" ]
          # shellcheck disable=SC2016  # literal backticks for markdown
          {
            cat bot-assets/prompt/task.md
            printf '\n## Runtime context\n\n'
            printf -- '- repository: `%s`\n' "$repository"
            printf -- '- number: `%s`\n' "$number"
            printf -- '- head_sha: `%s`\n' "$HEAD_SHA"
            printf -- '- dry run: `%s`\n' "$DRY_RUN"
            printf -- '- packet: `artefacts/target.json`\n'
          } > artefacts/prompt.md

      - name: 'Run agent (Copilot)'
        id: agent
        timeout-minutes: ${{ fromJSON(needs.prepare.outputs.agent_timeout) }}
        env:
          COPILOT_GITHUB_TOKEN: "${{ secrets.copilot_token }}"
          COPILOT_HOME: "${{ runner.temp }}/copilot"
          MODEL: "${{ inputs.model }}"
        run: |
          # The prefix rejects native/classic tokens, not extra PAT
          # grants. The caller must provision Copilot Requests only.
          case "$COPILOT_GITHUB_TOKEN" in
            github_pat_*) ;;
            *)
              echo '::error::Use a model-only fine-grained Copilot PAT'
              exit 1 ;;
          esac
          mkdir -p artefacts/copilot-logs
          prompt="$(cat artefacts/prompt.md)"
          # Read-only utilities for the packet. The CLI auto-approves
          # what it classifies as a read, so the allow list states
          # intent; enforcement is the missing credential, the deny
          # list below and the apply job's own checks. awk, sed and
          # find stay out: each can write or run commands.
          allow=''
          for cmd in cat jq grep head tail wc ls; do
            allow="$allow,shell($cmd),shell($cmd:*)"
          done
          copilot \
            --prompt="$prompt" \
            --model="$MODEL" \
            --available-tools=bash,list_bash,read_bash,stop_bash \
            --allow-tool="${allow#,}" \
            --deny-tool='write,shell(gh),shell(gh:*),shell(git),shell(git:*)' \
            --secret-env-vars=COPILOT_GITHUB_TOKEN \
            --no-ask-user --no-custom-instructions --disable-builtin-mcps \
            --no-auto-update --no-color \
            --log-dir=artefacts/copilot-logs \
            --usage-output-file artefacts/usage.json \
            --share=artefacts/session-summary.md

      - name: 'Preserve session output'
        if: always() && steps.packet.outcome == 'success'
        # yamllint disable-line rule:line-length
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # One name per target across attempts, so the apply job
          # always finds it; a rerun of this entry replaces its own
          # earlier session instead of colliding with it.
          # yamllint disable-line rule:line-length
          name: "bot-session-${{ needs.prepare.outputs.namespace }}-${{ matrix.key }}"
          path: |
            artefacts/session-summary.md
            artefacts/usage.json
            artefacts/prompt.md
            artefacts/copilot-logs/
          retention-days: 7
          overwrite: true
          if-no-files-found: 'warn'

      # Hygiene, not secure erasure: plain deletion of the CLI's
      # spilled tool output and its home on a single-use VM.
      # continue-on-error because cleanup must never gate apply.
      - name: 'Clear session scratch files'
        if: always()
        continue-on-error: true
        env:
          COPILOT_HOME: "${{ runner.temp }}/copilot"
        run: |
          scratch="${TMPDIR:-/tmp}"
          found=$(find "$scratch" -maxdepth 1 -type f \
            -name '*-copilot-tool-output-*' -print -delete)
          removed=0
          if [ -n "$found" ]; then
            removed=$(printf '%s\n' "$found" | wc -l | tr -d '[:space:]')
          fi
          rm -rf "$COPILOT_HOME"
          echo "Cleared $removed spilled tool-output file(s) and the CLI home."

  apply:
    name: 'Apply (${{ matrix.key }})'
    needs: [prepare, agent]
    # Runs after every agent entry, including failed ones, so each
    # target gets a verdict; never after cancellation or a failed
    # preparation.
    if: >-
      !cancelled() && needs.prepare.result == 'success' &&
      needs.prepare.outputs.run_agent == 'true'
    runs-on: 'ubuntu-latest'
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    permissions:
      actions: read  # Locate the session artifact for this matrix key
      contents: read  # Checkout the trusted applier
    steps:
      - name: 'Load egress allow-list'
        if: inputs.egress_policy == 'block'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@a32eb064a1188f6b0f15d2c0c0381efe54b0dd22 # v0.12.2
        with:
          config: "${{ inputs.egress_allow_config }}"
          allow_list_summary: 'false'

      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: "${{ inputs.egress_policy }}"
          allowed-endpoints: "${{ env.CONNECTION_ALLOW_LIST }}"

      - name: 'Require trusted provenance'
        env:
          ASSETS_SHA: "${{ needs.prepare.outputs.assets_sha }}"
          EVIDENCE_ID: "${{ needs.prepare.outputs.evidence_id }}"
          SELECTION_SHA: "${{ needs.prepare.outputs.selection_sha256 }}"
          LEDGER_SHA: "${{ needs.prepare.outputs.ledger_sha256 }}"
          KEY: "${{ matrix.key }}"
        run: |
          [[ "$ASSETS_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EVIDENCE_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$SELECTION_SHA" =~ ^[0-9a-f]{64}$ ]]
          [[ "$LEDGER_SHA" =~ ^[0-9a-f]{64}$ ]]
          [[ "$KEY" =~ ^[A-Za-z0-9_.-]+$ ]]

      - name: 'Checkout trusted applier'
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: "${{ inputs.assets_repository }}"
          ref: "${{ needs.prepare.outputs.assets_sha }}"
          path: 'bot-assets'
          persist-credentials: false

      - name: 'Fetch selection evidence'
        # yamllint disable-line rule:line-length
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: "${{ needs.prepare.outputs.evidence_id }}"
          merge-multiple: true
          path: 'evidence'

      - name: 'Verify evidence bytes'
        id: verified
        env:
          SELECTION_SHA: "${{ needs.prepare.outputs.selection_sha256 }}"
          LEDGER_SHA: "${{ needs.prepare.outputs.ledger_sha256 }}"
        run: |
          python3 bot-assets/scripts/bot_evidence.py verify \
            --directory evidence \
            --expect "selection.json=$SELECTION_SHA" \
            --expect "ledger.json=$LEDGER_SHA"

      # The session is untrusted whatever its name, and its archive is
      # never extracted blindly: artifact_fetch.py bounds the zip size,
      # entry count and each file before writing anything. A missing
      # or refused artifact still yields a verdict for this target,
      # through the --failure text below.
      - name: 'Fetch and accept bounded session'
        id: fetch
        env:
          GH_TOKEN: "${{ github.token }}"
          REPOSITORY: "${{ github.repository }}"
          RUN_ID: "${{ github.run_id }}"
          # yamllint disable-line rule:line-length
          NAME: "bot-session-${{ needs.prepare.outputs.namespace }}-${{ matrix.key }}"
        run: |
          status=0
          python3 bot-assets/scripts/artifact_fetch.py \
            --repository "$REPOSITORY" --run-id "$RUN_ID" --name "$NAME" \
            --profile session --output accepted >> "$GITHUB_OUTPUT" \
            || status=$?
          case "$status" in
            0) failure='' ;;
            3) failure='the agent job produced no session artifact' ;;
            4) failure='the session artifact failed bounded acceptance' ;;
            *) exit "$status" ;;
          esac
          echo "failure=$failure" >> "$GITHUB_OUTPUT"

      # Replace: scripts/apply.py check is the template's shape check
      # on the verdict block. The bot's version adds its own
      # corroboration; it must still print approvable=true|false.
      - name: 'Check verdict offline'
        id: check
        env:
          KEY: "${{ matrix.key }}"
          FAILURE: "${{ steps.fetch.outputs.failure }}"
        run: |
          extra=()
          if [ -n "$FAILURE" ]; then extra+=(--failure "$FAILURE"); fi
          mkdir -p accepted artefacts
          python3 bot-assets/scripts/apply.py check \
            --selection evidence/selection.json --key "$KEY" \
            --session-dir accepted \
            --output artefacts/check.json \
            --summary artefacts/check-summary.md "${extra[@]}" \
            >> "$GITHUB_OUTPUT"
          cat artefacts/check-summary.md >> "$GITHUB_STEP_SUMMARY"

      # The one write this pipeline makes. Minted for one repository,
      # only on the live path, only once the offline check accepted
      # the verdict. Replace the placeholder grant with the single
      # write permission the bot's action needs (for example
      # permission-pull-requests: 'write' or permission-issues:
      # 'write'); everything else stays read.
      - name: 'Mint write token'
        id: write-token
        if: >-
          !inputs.dry_run && steps.check.outputs.approvable == 'true' &&
          inputs.github_app_client_id != ''
        # yamllint disable-line rule:line-length
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: "${{ inputs.github_app_client_id }}"
          private-key: "${{ secrets.github_app_private_key }}"
          owner: "${{ inputs.org }}"
          # The bare name, relative to owner: independent of how the
          # action parses an owner/repository form.
          repositories: "${{ matrix.repo_name }}"
          # Placeholder: the template grants no write at all.
          permission-metadata: 'read'

      # The one write token: confirm it came from the configured App
      # before it is used. A token scoped to one repository cannot be
      # probed read-only, so identity is the check here.
      - name: 'Pre-flight: write token identity'
        if: steps.write-token.outcome == 'success'
        env:
          MINTED_SLUG: "${{ steps.write-token.outputs.app-slug }}"
        run: |
          python3 bot-assets/scripts/preflight.py identity \
            --config bot-assets/config/bot.json --minted-slug "$MINTED_SLUG"

      # Replace: scripts/apply.py apply writes result.json and makes
      # no write; the bot's version re-reads the live target and
      # makes its one write with the token above.
      - name: 'Apply verdict'
        id: apply
        env:
          GH_TOKEN: "${{ steps.write-token.outputs.token || github.token }}"
          DRY_RUN: "${{ inputs.dry_run }}"
          RUN_ATTEMPT: "${{ github.run_attempt }}"
          # yamllint disable-line rule:line-length
          RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: |
          extra=()
          if [ "$DRY_RUN" = true ]; then extra+=(--dry-run); fi
          python3 bot-assets/scripts/apply.py apply \
            --check artefacts/check.json \
            --output artefacts/result.json \
            --run-url "$RUN_URL" --run-attempt "$RUN_ATTEMPT" "${extra[@]}"

      # Every selected target gets a row in the report. When an
      # earlier step failed before apply wrote a result (the offline
      # check, a token mint, GitHub unreachable), record a typed
      # failure.
      - name: 'Ensure a result exists'
        if: always()
        env:
          KEY: "${{ matrix.key }}"
          REPOSITORY: "${{ matrix.repository }}"
          REPO_NAME: "${{ matrix.repo_name }}"
          NUMBER: "${{ matrix.number }}"
          HEAD_SHA: "${{ matrix.head_sha }}"
          DRY_RUN: "${{ inputs.dry_run }}"
          RUN_ATTEMPT: "${{ github.run_attempt }}"
          CHECK_OUTCOME: "${{ steps.check.outcome }}"
          APPLY_OUTCOME: "${{ steps.apply.outcome }}"
        run: |
          # shellcheck disable=SC2016  # jq variables, not shell expansions
          if [ -s artefacts/result.json ]; then exit 0; fi
          mkdir -p artefacts
          reason="apply did not complete (offline check: $CHECK_OUTCOME,"
          reason="$reason apply: $APPLY_OUTCOME)"
          jq -n --arg key "$KEY" --arg repo "$REPOSITORY" \
            --arg name "$REPO_NAME" --argjson number "$NUMBER" \
            --arg head "$HEAD_SHA" --arg reason "$reason" \
            --argjson dry "$DRY_RUN" --argjson attempt "$RUN_ATTEMPT" '
            {
              schema: 1, key: $key, repository: $repo, repo_name: $name,
              number: $number, head_sha: $head, verdict: "failed",
              reasons: [$reason], summary: null, write_url: null,
              dry_run: $dry, run_attempt: $attempt, run_url: null
            }' > artefacts/result.json

      - name: 'Attach apply result'
        if: always()
        # yamllint disable-line rule:line-length
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # yamllint disable-line rule:line-length
          name: "bot-result-${{ needs.prepare.outputs.namespace }}-${{ matrix.key }}-${{ github.run_attempt }}"
          path: |
            artefacts/check.json
            artefacts/check-summary.md
            artefacts/result.json
          retention-days: 90
          if-no-files-found: 'warn'

  report:
    name: 'Report'
    needs: [prepare, agent, apply]
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    runs-on: 'ubuntu-latest'
    timeout-minutes: 10
    permissions:
      actions: read  # Gather per-target result artifacts
      contents: read  # Checkout the report script
    steps:
      - name: 'Load egress allow-list'
        if: inputs.egress_policy == 'block'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@a32eb064a1188f6b0f15d2c0c0381efe54b0dd22 # v0.12.2
        with:
          config: "${{ inputs.egress_allow_config }}"
          allow_list_summary: 'false'

      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: "${{ inputs.egress_policy }}"
          allowed-endpoints: "${{ env.CONNECTION_ALLOW_LIST }}"

      - name: 'Require trusted provenance'
        env:
          ASSETS_SHA: "${{ needs.prepare.outputs.assets_sha }}"
          EVIDENCE_ID: "${{ needs.prepare.outputs.evidence_id }}"
          SELECTION_SHA: "${{ needs.prepare.outputs.selection_sha256 }}"
          LEDGER_SHA: "${{ needs.prepare.outputs.ledger_sha256 }}"
        run: |
          [[ "$ASSETS_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EVIDENCE_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$SELECTION_SHA" =~ ^[0-9a-f]{64}$ ]]
          [[ "$LEDGER_SHA" =~ ^[0-9a-f]{64}$ ]]

      - name: 'Checkout report script'
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: "${{ inputs.assets_repository }}"
          ref: "${{ needs.prepare.outputs.assets_sha }}"
          path: 'bot-assets'
          persist-credentials: false

      - name: 'Fetch selection evidence'
        # yamllint disable-line rule:line-length
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: "${{ needs.prepare.outputs.evidence_id }}"
          merge-multiple: true
          path: 'evidence'

      - name: 'Verify evidence bytes'
        env:
          SELECTION_SHA: "${{ needs.prepare.outputs.selection_sha256 }}"
          LEDGER_SHA: "${{ needs.prepare.outputs.ledger_sha256 }}"
        run: |
          python3 bot-assets/scripts/bot_evidence.py verify \
            --directory evidence \
            --expect "selection.json=$SELECTION_SHA" \
            --expect "ledger.json=$LEDGER_SHA"

      - name: 'Gather results'
        if: needs.prepare.outputs.run_agent == 'true'
        # yamllint disable-line rule:line-length
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "bot-result-${{ needs.prepare.outputs.namespace }}-*"
          path: 'results'

      # Replace: scripts/report.py is the template's generic report;
      # the bot's version adds the columns its results carry.
      - name: 'Build report and ledger'
        env:
          RUN_ID: "${{ github.run_id }}"
          AGENT_RESULT: "${{ needs.agent.result }}"
          APPLY_RESULT: "${{ needs.apply.result }}"
        run: |
          mkdir -p results artefacts ledger
          python3 bot-assets/scripts/report.py \
            --selection evidence/selection.json --results results \
            --ledger evidence/ledger.json --run-id "$RUN_ID" \
            --output-md artefacts/report.md \
            --output-json artefacts/report.json \
            --output-ledger ledger/ledger.json
          cat artefacts/report.md >> "$GITHUB_STEP_SUMMARY"
          printf '\nAgent job: %s; apply job: %s\n' \
            "$AGENT_RESULT" "$APPLY_RESULT" >> "$GITHUB_STEP_SUMMARY"

      - name: 'Attach run report'
        # yamllint disable-line rule:line-length
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # yamllint disable-line rule:line-length
          name: "bot-report-${{ needs.prepare.outputs.namespace }}-${{ github.run_attempt }}"
          path: 'artefacts/'
          retention-days: 90
          if-no-files-found: 'warn'

      # The next run's prepare job fetches the newest few of these by
      # name and merges them (scripts/ledger.py). A fixed name is
      # unique within a run, which is all the upload requires.
      - name: 'Publish ledger'
        # yamllint disable-line rule:line-length
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: 'bot-ledger'
          path: 'ledger/'
          retention-days: 90
          if-no-files-found: 'error'
